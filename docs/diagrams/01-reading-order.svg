<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:900px;font-family:sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">kiro2cc-proxy 源码阅读顺序（按先到后）</text>

  <!-- 阶段 0 -->
  <rect x="60" y="55" width="780" height="58" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="78" font-size="12" fill="#1a56c4" font-weight="bold">阶段 0 · 把项目当用户跑起来（0.5 天）</text>
  <text x="80" y="98" font-size="10.5" fill="#333">run-local-service-mac.sh 启动 → Claude Code 发消息 → Admin UI 逛一遍 → 对照 config.json 与代码字段</text>

  <line x1="450" y1="113" x2="450" y2="133" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 1 -->
  <rect x="60" y="135" width="780" height="58" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="158" font-size="12" fill="#1a56c4" font-weight="bold">阶段 1 · 建立全局地图（1 天）</text>
  <text x="80" y="178" font-size="10.5" fill="#333">CLAUDE.md 链路图 → 《源码全景解析》架构章节 → 《代码速查表》总览 → 目录树逐目录写一句职责</text>

  <line x1="450" y1="193" x2="450" y2="213" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 2 主链路（大框，内部分四步） -->
  <rect x="60" y="215" width="780" height="230" rx="6" fill="#fef7e0" stroke="#f4b400" stroke-width="1.5"/>
  <text x="80" y="238" font-size="12" fill="#9a6b00" font-weight="bold">阶段 2 · 主链路精读：一个请求的一生（3~5 天，核心阶段）</text>

  <!-- 2.1 -->
  <rect x="80" y="252" width="740" height="40" rx="4" fill="#fff" stroke="#e0c060" stroke-width="1"/>
  <text x="95" y="268" font-size="11" fill="#333" font-weight="bold">① 入口与认证（第 1 天）</text>
  <text x="95" y="284" font-size="10" fill="#555">main.rs → anthropic/router.rs → middleware.rs → handlers/post_messages.rs → post_messages_cc/mod.rs</text>

  <line x1="450" y1="292" x2="450" y2="300" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.2 -->
  <rect x="80" y="303" width="740" height="40" rx="4" fill="#fff" stroke="#e0c060" stroke-width="1"/>
  <text x="95" y="319" font-size="11" fill="#333" font-weight="bold">② 协议转换 converter（第 2~3 天，项目心脏）★ 重点停留 history.rs</text>
  <text x="95" y="335" font-size="10" fill="#555">mod.rs → model.rs → convert.rs → message.rs → history.rs → tools.rs → fields.rs → schema.rs → session.rs</text>

  <line x1="450" y1="343" x2="450" y2="351" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.3 -->
  <rect x="80" y="354" width="740" height="40" rx="4" fill="#fff" stroke="#e0c060" stroke-width="1"/>
  <text x="95" y="370" font-size="11" fill="#333" font-weight="bold">③ 发送与多账号（第 4 天）</text>
  <text x="95" y="386" font-size="10" fill="#555">provider/mod.rs+core.rs → provider/retry.rs → kiro/endpoint.rs → token_manager/mod.rs+manager/ → token_manager/refresh.rs</text>

  <line x1="450" y1="394" x2="450" y2="402" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2.4 -->
  <rect x="80" y="405" width="740" height="30" rx="4" fill="#fff" stroke="#e0c060" stroke-width="1"/>
  <text x="95" y="418" font-size="11" fill="#333" font-weight="bold">④ 二进制帧与 SSE 输出（第 5 天）</text>
  <text x="95" y="430" font-size="10" fill="#555">parser/frame.rs+decoder.rs → stream/state.rs → stream/mod.rs+thinking.rs → stream/thinking_text.rs → stream/calib.rs</text>

  <line x1="450" y1="445" x2="450" y2="465" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 3 -->
  <rect x="60" y="467" width="780" height="48" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="80" y="486" font-size="12" fill="#1e7e34" font-weight="bold">阶段 3 · 支链与外挂模块（2~3 天）</text>
  <text x="80" y="504" font-size="10.5" fill="#333">openai/ 兼容层 → cache/ 四层降级 → token.rs 计数缩放 → admin/ API → model/ 数据模型 → 前端仅看 settings-panel.tsx</text>

  <line x1="450" y1="515" x2="450" y2="528" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 4 -->
  <rect x="60" y="530" width="780" height="48" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="80" y="549" font-size="12" fill="#b3261e" font-weight="bold">阶段 4 · 难点攻坚（5+ 天）</text>
  <text x="80" y="567" font-size="10.5" fill="#333">① 二进制帧协议 → ② thinking 标签检测重建 → ③ prompt cache 四层降级链 → ④ tiktoken 与 0.6657 显示缩放</text>

  <line x1="450" y1="578" x2="450" y2="588" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 5 -->
  <rect x="60" y="590" width="780" height="26" rx="6" fill="#f3e8fd" stroke="#9334e6" stroke-width="1.5"/>
  <text x="450" y="608" text-anchor="middle" font-size="12" fill="#6a1da8" font-weight="bold">阶段 5 · 精通验证——改造实战（文案热身 → 模型映射进阶 → 响应头挑战 → history[0] 复述终极）</text>

  <!-- 图例 -->
  <text x="80" y="614" font-size="9" fill="#888">颜色仅用于区分阶段；箭头表示推荐阅读先后顺序；每阶段过关标准见正文对应章节</text>
</svg>
