<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:900px;font-family:sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#fafafa"/>

  <text x="450" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">功能① 协议转换：Claude Code 请求 → Kiro 请求（内部阅读顺序）</text>

  <!-- 步骤 1 -->
  <rect x="60" y="48" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="68" font-size="11.5" fill="#1a56c4" font-weight="bold">① handlers/post_messages.rs — 入口：拿到 MessagesRequest，决定走流式/非流式</text>
  <text x="80" y="86" font-size="10" fill="#555">关注点：转换发生在哪一行调用 convert_request</text>

  <line x1="450" y1="100" x2="450" y2="114" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 步骤 2 -->
  <rect x="60" y="116" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="136" font-size="11.5" fill="#1a56c4" font-weight="bold">② converter/convert.rs — convert_request 主流程骨架：current_message 与 history 怎么组装</text>
  <text x="80" y="154" font-size="10" fill="#555">determine_chat_trigger_type / determine_agent_task_type 区分对话与 Agent 任务</text>

  <line x1="450" y1="168" x2="450" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 步骤 3 -->
  <rect x="60" y="184" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="204" font-size="11.5" fill="#1a56c4" font-weight="bold">③ converter/model.rs — 模型映射 map_model：关键词（sonnet/opus/haiku/gpt）+ 版本号决定代际</text>
  <text x="80" y="222" font-size="10" fill="#555">thinking 后缀触发 extended thinking；未指定版本时 opus 兜底 4.6</text>

  <line x1="450" y1="236" x2="450" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 步骤 4 -->
  <rect x="60" y="252" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="272" font-size="11.5" fill="#1a56c4" font-weight="bold">④ converter/session.rs + prompt.rs — 会话标识派生链与 history[0] 稳定化的四个守卫函数</text>
  <text x="80" y="290" font-size="10" fill="#555">extract_session_id → derive_agent_continuation_id；normalize_billing_header（cch= → 0）、is_dynamic_hook_injection</text>

  <line x1="450" y1="304" x2="450" y2="318" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 步骤 5（重点） -->
  <rect x="60" y="320" width="780" height="66" rx="6" fill="#fef7e0" stroke="#f4b400" stroke-width="2"/>
  <text x="80" y="342" font-size="11.5" fill="#9a6b00" font-weight="bold">⑤ converter/history.rs ★ 重点停留（心脏中的心脏）— build_history 与 history[0] 逐字节冻结</text>
  <text x="80" y="360" font-size="10" fill="#555">merge_user_messages / convert_assistant_message / merge_assistant_messages 各解决什么合并问题；</text>
  <text x="80" y="376" font-size="10" fill="#555">配读 message.rs（四类内容块提取）与 pdf.rs（PDF 为什么本地提取）</text>

  <line x1="450" y1="386" x2="450" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 步骤 6 -->
  <rect x="60" y="402" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="422" font-size="11.5" fill="#1a56c4" font-weight="bold">⑥ converter/tools.rs + schema.rs + websearch.rs + fields.rs — 工具、Schema、桥接工具、字段约束</text>
  <text x="80" y="440" font-size="10" fill="#555">tool_use/tool_result 配对校验；$ref 展开清洗；web_search 拆解注入；additionalModelRequestFields 代际矩阵</text>

  <line x1="450" y1="454" x2="450" y2="468" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 步骤 7 -->
  <rect x="60" y="470" width="780" height="52" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="80" y="490" font-size="11.5" fill="#1e7e34" font-weight="bold">⑦ kiro/provider/api.rs — 转换产物发出：call_api / call_api_stream（交功能④继续）</text>
  <text x="80" y="508" font-size="10" fill="#555">此时请求已是 Kiro JSON（userInputMessageContext 等原生命名），对照 src/kiro/model/requests/ 结构定义</text>

  <!-- 图例 -->
  <text x="80" y="552" font-size="9" fill="#888">箭头 = 阅读顺序；黄色 = 必须停留精读的文件；每步过关问题见路线图「阶段 2.5」正文表格</text>
  <text x="80" y="570" font-size="9" fill="#888">铁律：任何进入 history[0] 的字节必须跨请求逐字节稳定 —— 步骤④⑤的所有机制都为它服务</text>
</svg>
