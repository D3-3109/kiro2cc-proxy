<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:900px;font-family:sans-serif">
  <defs>
    <marker id="ar7" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#fafafa"/>
  <text x="450" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">功能⑥ prompt cache 四层降级链：cache_read 数值从哪来（内部阅读顺序）</text>

  <rect x="60" y="48" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="68" font-size="11.5" fill="#1a56c4" font-weight="bold">① cache/mod.rs — 入口 select_final_usage：四层降级链的选择顺序与失效条件</text>
  <text x="80" y="86" font-size="10" fill="#555">先记住「metering 真值 → 前缀估算 → fingerprint → 比例模拟」这条链，再逐层进去看</text>
  <line x1="450" y1="100" x2="450" y2="114" stroke="#555" stroke-width="1.5" marker-end="url(#ar7)"/>

  <rect x="60" y="116" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="136" font-size="11.5" fill="#1a56c4" font-weight="bold">② cache/simulation.rs — 末层兜底：三角分布与比例模式模拟（最简单，先懂兜底再看上层）</text>
  <text x="80" y="154" font-size="10" fill="#555">为什么旧公式要被替换；比例模式的输入是什么</text>
  <line x1="450" y1="168" x2="450" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#ar7)"/>

  <rect x="60" y="184" width="780" height="66" rx="6" fill="#fef7e0" stroke="#f4b400" stroke-width="2"/>
  <text x="80" y="204" font-size="11.5" fill="#9a6b00" font-weight="bold">③ cache/fingerprint.rs ★ — 账号级前缀指纹：按「系统段 + 各 message 段」切 segment</text>
  <text x="80" y="222" font-size="10" fill="#555">canonicalize：文本 trim、tool_use input 排序 JSON、image 短 hash——连 JSON key 顺序都要处理；</text>
  <text x="80" y="238" font-size="10" fill="#555">累积 SHA-256 保证前缀单调性；cache_read 封顶 0.85 × total_input；30s 周期 evict 后台任务</text>
  <line x1="450" y1="250" x2="450" y2="264" stroke="#555" stroke-width="1.5" marker-end="url(#ar7)"/>

  <rect x="60" y="266" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="286" font-size="11.5" fill="#1a56c4" font-weight="bold">④ token.rs — 前缀估算：count_prefix_tokens（tiktoken cl100k_base BPE 全局单例）</text>
  <text x="80" y="304" font-size="10" fill="#555">估算层为什么放在 fingerprint 之下：精度与开销的取舍</text>
  <line x1="450" y1="318" x2="450" y2="332" stroke="#555" stroke-width="1.5" marker-end="url(#ar7)"/>

  <rect x="60" y="334" width="780" height="66" rx="6" fill="#fef7e0" stroke="#f4b400" stroke-width="2"/>
  <text x="80" y="354" font-size="11.5" fill="#9a6b00" font-weight="bold">⑤ converter/cache.rs + prompt.rs ★ — 上游供给端：history[0] 冻结缓存（CacheEntry / PREV_H0）</text>
  <text x="80" y="372" font-size="10" fill="#555">normalize_billing_header（cch= → 0）等四个守卫函数——没有 history[0] 逐字节稳定，</text>
  <text x="80" y="388" font-size="10" fill="#555">上面四层算得再准也是零命中；fingerprint 为什么必须是账号级</text>
  <line x1="450" y1="400" x2="450" y2="414" stroke="#555" stroke-width="1.5" marker-end="url(#ar7)"/>

  <rect x="60" y="416" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="436" font-size="11.5" fill="#1a56c4" font-weight="bold">⑥ stream/calib.rs — 消费端：usage 校准口径如何影响显示与 auto-compact（衔接功能⑤⑦）</text>
  <text x="80" y="454" font-size="10" fill="#555">cache_read 与 input_tokens 在 SSE message_delta 里怎么呈现给客户端</text>
  <line x1="450" y1="468" x2="450" y2="482" stroke="#555" stroke-width="1.5" marker-end="url(#ar7)"/>

  <rect x="60" y="484" width="780" height="44" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="80" y="502" font-size="11.5" fill="#1e7e34" font-weight="bold">⑦ 实操：.claude/skills/cache-credits-analyzer/ — 分析访问日志计算 prompt cache 节省的 credits</text>
  <text x="80" y="518" font-size="10" fill="#555">用真实数据验证每一层的触发比例</text>

  <text x="80" y="556" font-size="9" fill="#888">检验：每一层的触发条件与失效顺序？metering 真值什么时候拿不到？</text>
</svg>
