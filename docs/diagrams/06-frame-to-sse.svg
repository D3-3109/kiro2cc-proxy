<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;max-width:900px;font-family:sans-serif">
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#fafafa"/>
  <text x="450" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">功能⑤ 二进制帧 → SSE：Kiro 字节流怎么变成 Claude Code 的事件（内部阅读顺序）</text>

  <rect x="60" y="48" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="68" font-size="11.5" fill="#1a56c4" font-weight="bold">① kiro/parser/frame.rs + decoder.rs — AWS Event Stream 帧结构：总长/头长/payload 边界判定</text>
  <text x="80" y="86" font-size="10" fill="#555">为什么上游不用 JSON/SSE 而用二进制帧；一帧的完整字节布局</text>
  <line x1="450" y1="100" x2="450" y2="114" stroke="#555" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="60" y="116" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="136" font-size="11.5" fill="#1a56c4" font-weight="bold">② kiro/parser/header.rs + crc.rs — header name/value 编码解析；CRC32C 查表实现与校验范围</text>
  <text x="80" y="154" font-size="10" fill="#555">解析错误分类（error.rs）；CRC 算的是哪些字节</text>
  <line x1="450" y1="168" x2="450" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="60" y="184" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="204" font-size="11.5" fill="#1a56c4" font-weight="bold">③ anthropic/stream/state.rs — SSE 状态机：SseStateManager 事件类型驱动的状态迁移</text>
  <text x="80" y="222" font-size="10" fill="#555">next_block_index / set_has_tool_use / set_stop_reason；content_block_start ↔ stop 的配对纪律</text>
  <line x1="450" y1="236" x2="450" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="60" y="252" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="272" font-size="11.5" fill="#1a56c4" font-weight="bold">④ anthropic/stream/mod.rs + helpers.rs — 主映射：Kiro 事件 → Anthropic SSE 事件（SseEvent 定义）</text>
  <text x="80" y="290" font-size="10" fill="#555">assistantResponse / toolUse 等上游事件各自变成哪些 SSE 事件</text>
  <line x1="450" y1="304" x2="450" y2="318" stroke="#555" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="60" y="320" width="780" height="66" rx="6" fill="#fef7e0" stroke="#f4b400" stroke-width="2"/>
  <text x="80" y="340" font-size="11.5" fill="#9a6b00" font-weight="bold">⑤ stream/thinking.rs ★ — thinking 标签检测重建：为什么不能靠单个 content_block 事件</text>
  <text x="80" y="358" font-size="10" fill="#555">标签跨 chunk 断裂时的文本级匹配；配读 stream/context/（native / tool_use / metrics 三切面：StreamContext</text>
  <text x="80" y="374" font-size="10" fill="#555">怎么持有 usage 统计、聚合 tool_use 事件）</text>
  <line x1="450" y1="386" x2="450" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="60" y="402" width="780" height="52" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="80" y="422" font-size="11.5" fill="#1a56c4" font-weight="bold">⑥ stream/echo_guard.rs — 回声防护：模型复述 system-reminder 时的最后一道关口</text>
  <text x="80" y="440" font-size="10" fill="#555">「标签前缀已到、闭合标签未到」的部分前缀等待怎么处理</text>
  <line x1="450" y1="454" x2="450" y2="468" stroke="#555" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="60" y="470" width="780" height="44" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="80" y="488" font-size="11.5" fill="#1e7e34" font-weight="bold">⑦ stream/calib.rs — usage 校准：CLIENT_TOKEN_DISPLAY_SCALE = 0.6657、输入封顶、直通开关</text>
  <text x="80" y="504" font-size="10" fill="#555">与功能⑧（prompt cache / token 计数）衔接：这里输出的 usage 口径决定客户端 auto-compact 时机</text>

  <text x="80" y="540" font-size="9" fill="#888">验证：Kiro 二进制帧从哪一步变成 content_block_delta？（步骤④）流式 tool_use 事件在哪个切面聚合？（context/tool_use.rs）</text>
</svg>
