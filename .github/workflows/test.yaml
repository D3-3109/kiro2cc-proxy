name: Tests

# Pushes to the default branch are tested by docker-build.yaml, which calls
# this workflow before building the image.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      # The frontends are type-checked by their builds, and rust-embed needs
      # the dist folders to exist at compile time.
      - name: Build admin-ui
        working-directory: web-ui/admin-ui
        run: |
          pnpm install
          pnpm build

      - name: Build user-ui
        working-directory: web-ui/user-ui
        run: |
          npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-cache-test
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      # Test modules carry upstream clippy debt, so only non-test code is gated.
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked
